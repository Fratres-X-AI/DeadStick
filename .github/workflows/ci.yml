name: CI

on:
  push:
    branches: [main, master, phase3-fixes, repo-cleanup]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy deadstick
      - name: Unit tests with coverage
        env:
          PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"
        run: pytest tests/unit -q --cov=deadstick --cov-report=term-missing
