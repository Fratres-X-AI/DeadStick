id: r02_rc_loss_rtl_when_configured
say: >-
  When RC loss action is configured for RTL via FS_THR_ENABLE, the vehicle must
  enter RTL within a bounded time after fault injection (requirement).
kind: requirement
vehicle: copter
requires_params:
  - FS_THR_ENABLE
  - FS_OPTIONS
  - RC_FS_TIMEOUT
precondition:
  expr: FS_THR_ENABLE != 0
  reason_if_not: >-
    Radio failsafe disabled (FS_THR_ENABLE = 0). RTL-on-loss requirement does not apply.
scenario:
  - inject_fault:
      kind: rc_loss_in_air
confirm_fault:
  any_of:
    - statustext: "(?i)radio.*failsafe|rc.*failsafe"
  within_s: 5
expect:
  - check: expect_mode_within
    within_s_expr: "RC_FS_TIMEOUT + 1.0"
    modes_from: expectations.rc_loss_action
